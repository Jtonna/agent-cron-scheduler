appId: com.agentcronsystem.scheduler
productName: AgentCronScheduler
npmRebuild: false
publish: null

directories:
  output: ../../../dist

files:
  - electron/**/*
  - standalone/**/*
  - package.json

extraResources:
  - from: ../../../acs/target/release
    to: agentcronsystem-binary
    filter:
      - "agentcronsystem"
      - "agentcronsystem.exe"

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-windows.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  perMachine: false

mac:
  target:
    - target: dmg
      arch: [x64]
  artifactName: ${productName}-${version}-mac.${ext}
  category: public.app-category.utilities

linux:
  target:
    - target: AppImage
      arch: [x64]
  artifactName: ${productName}-${version}-linux.${ext}
