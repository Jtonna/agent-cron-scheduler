name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  version-bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Bump version
        id: bump
        shell: bash
        run: |
          CURRENT_VERSION=$(node -e "console.log(require('./electron/package.json').version)")
          echo "Current version: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "${{ inputs.bump }}" in
            patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
          esac

          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # Bump electron/package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('electron/package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('electron/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Bump electron/packages/app/package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('electron/packages/app/package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('electron/packages/app/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Bump acs/Cargo.toml (anchored to line start)
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" acs/Cargo.toml

          # Bump acs/web/openapi.yaml — replace ALL version: "X.Y.Z" patterns
          # Read current openapi version (may differ from package.json due to known desync)
          OPENAPI_VERSION=$(grep -oP 'version: "\K[^"]+' acs/web/openapi.yaml | head -1)
          if [ -n "$OPENAPI_VERSION" ]; then
            sed -i "s/version: \"$OPENAPI_VERSION\"/version: \"$NEW_VERSION\"/g" acs/web/openapi.yaml
          fi

          # Regenerate lockfile
          cd electron && npm install --package-lock-only --silent

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add acs/Cargo.toml acs/web/openapi.yaml electron/package.json electron/packages/app/package.json electron/package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.new_version }}"

  build:
    needs: version-bump
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version-bump.outputs.new_version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            acs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('acs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build ACS binary
        run: cargo build --release
        working-directory: acs

      - name: Rename raw binary for release
        shell: bash
        run: |
          mkdir -p dist-raw
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp acs/target/release/agentcronsystem.exe dist-raw/agentcronsystem-windows-x86_64.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp acs/target/release/agentcronsystem dist-raw/agentcronsystem-macos-aarch64
          else
            cp acs/target/release/agentcronsystem dist-raw/agentcronsystem-linux-x86_64
          fi

      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron

      - name: Build frontend
        run: npm run build
        working-directory: electron/packages/frontend

      - name: Copy frontend to Electron app
        shell: bash
        run: |
          mkdir -p electron/packages/app/out
          cp -r electron/packages/frontend/out/* electron/packages/app/out/

      - name: Build & package
        run: npm run dist:${{ matrix.platform }}
        working-directory: electron/packages/app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentcronsystem-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist-raw/*
          if-no-files-found: warn

  release:
    needs: [version-bump, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-bump.outputs.new_version }}
          files: artifacts/**/*
          body: |
            ## Downloads

            | Platform | Installer | Raw Binary |
            |----------|-----------|------------|
            | Windows | `AgentCronScheduler-v${{ needs.version-bump.outputs.new_version }}-windows.exe` | `agentcronsystem-windows-x86_64.exe` |
            | macOS | `AgentCronScheduler-v${{ needs.version-bump.outputs.new_version }}-mac.dmg` | `agentcronsystem-macos-aarch64` |
            | Linux | `AgentCronScheduler-v${{ needs.version-bump.outputs.new_version }}-linux.AppImage` | `agentcronsystem-linux-x86_64` |

            ### Installation
            **Windows** — Run the `.exe` installer. SmartScreen warning expected (unsigned).
            **macOS** — Drag to Applications, right-click and "Open" to bypass Gatekeeper.
            **Linux** — `chmod +x *.AppImage && ./AgentCronScheduler-*.AppImage`

            ### Raw Binaries
            Raw compiled binaries are provided for use with the `acs update` command and headless environments.
