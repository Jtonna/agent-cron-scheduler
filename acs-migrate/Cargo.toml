[package]
name = "acs-migrate"
version = "5.0.0"
edition = "2021"
license = "MIT"
description = "Flyway-style SQLite migration runner for the agent-cron-scheduler daemon"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
